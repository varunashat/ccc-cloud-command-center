<style id="ccc-theme-css">
:root{--bg:#060a14;--bg2:#0a1020;--s1:#0d1527;--s2:#111b31;--s3:#16223c;--line:#1c2945;--line2:#26365a;--tx:#e7eef9;--mu:#8b9bb9;--mu2:#5f6f8e;

::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#1f2c49;border-radius:8px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}
/* sidebar */
aside.hosted-sidebar{box-sizing:border-box!important;width:var(--sbw)!important;padding:18px 14px!important;background:linear-gradient(180deg,rgba(13,21,39,.96),rgba(8,13,26,.98))!important;border-right:1px solid var(--line)!important;backdrop-filter:blur(12px);z-index:30!important;display:flex;flex-direction:column;overflow-y:auto}

.ccc-logo{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;background:conic-gradient(from 210deg,var(--cy),var(--bl),var(--vi),var(--te),var(--cy));box-shadow:0 6px 20px -6px rgba(34,211,238,.6)}
.ccc-logo svg{width:20px;height:20px}
.ccc-bt b{display:block;font-size:15px;font-weight:700;letter-spacing:.2px;color:#fff;line-height:1.15}.ccc-bt small{display:block;font-size:9.5px;color:var(--mu);letter-spacing:.9px;white-space:nowrap;text-transform:uppercase;margin-top:3px}
nav.workspace-nav{display:flex!important;flex-direction:column;gap:2px!important}
.ccc-grp{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mu2);margin:14px 10px 6px;font-weight:600}

nav.workspace-nav a svg{width:17px;height:17px;flex:none;opacity:.8}
nav.workspace-nav a:hover{background:rgba(148,163,184,.08)!important;color:#fff!important}
nav.workspace-nav a.ccc-on{background:linear-gradient(90deg,rgba(34,211,238,.16),rgba(59,130,246,.06))!important;color:#fff!important;box-shadow:inset 0 0 0 1px rgba(34,211,238,.18)}
nav.workspace-nav a.ccc-on:before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--cy);box-shadow:0 0 12px var(--cy)}

#ccc-tam-link{margin-top:2px}
.ccc-sbfoot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line);font-size:11px;color:var(--mu2);display:flex;align-items:center;gap:8px}
.ccc-dot{width:8px;height:8px;border-radius:50%;background:var(--gr);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:cccpulse 2s infinite;flex:none}

#ccc-top>div.row button{padding:6px 12px!important}

main{margin-left:var(--sbw)!important;padding:calc(var(--tb) + 22px) 28px 40px!important;max-width:none!important;position:relative;z-index:1}
.workspace-view>h1{display:none!important}
#status{position:relative;margin:0 0 16px!important;padding:9px 14px 9px 34px!important;font-size:12.5px!important;color:#c9d6ee!important;background:linear-gradient(90deg,rgba(34,211,238,.08),rgba(17,27,49,.6))!important;border:1px solid var(--line)!important;border-radius:10px!important}

h1{font-weight:700!important;letter-spacing:-.4px}h2{font-weight:650!important;letter-spacing:-.1px;font-size:16px!important;color:#f1f5fd!important}
.muted,small{color:var(--mu)!important}
.panel,.card{background:linear-gradient(180deg,rgba(17,27,49,.82),rgba(12,19,36,.88))!important;border:1px solid var(--line)!important;border-radius:14px!important;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -18px rgba(0,0,0,.8)!important;backdrop-filter:blur(6px)}
.panel{padding:20px 22px!important}
.card{transition:border-color .15s,transform .15s,box-shadow .15s}.card:hover{border-color:rgba(34,211,238,.35)!important;box-shadow:var(--glow)!important}
.panel small:first-child{letter-spacing:1.3px;font-size:10.5px!important;text-transform:uppercase;color:var(--cy)!important;opacity:.85}
button{background:linear-gradient(135deg,#22d3ee,#3b82f6)!important;color:#04111f!important;border:0!important;border-radius:9px!important;font-weight:650!important;padding:8px 15px!important;box-shadow:0 6px 18px -8px rgba(34,211,238,.7);transition:filter .15s,transform .1s;cursor:pointer}
button:hover{filter:brightness(1.1)}button:active{transform:translateY(1px)}
button.secondary{background:rgba(22,34,60,.9)!important;color:#d6e2f6!important;border:1px solid var(--line2)!important;box-shadow:none}
button.secondary:hover{border-color:rgba(34,211,238,.5)!important;color:#fff!important}
button:disabled{opacity:.45!important;filter:grayscale(.4)}
#ccc-ai-btn{background:#0f766e!important;color:#fff!important}
select,input,textarea{background:#0a1222!important;color:var(--tx)!important;border:1px solid var(--line2)!important;border-radius:9px!important;padding:8px 10px!important;font:inherit;font-size:13px!important;outline:none;transition:border-color .15s,box-shadow .15s}

a{color:#67e8f9}

td{padding:8px 10px!important;border-bottom:1px solid rgba(28,41,69,.7)!important;color:#d6e0f1}

.ccc-hb{display:grid;grid-template-columns:minmax(110px,38%) 1fr auto;gap:8px 10px;align-items:center;font-size:12px}
.ccc-hb .n{color:#c9d5ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ccc-hb .t{height:8px;border-radius:5px;background:#16223c;overflow:hidden}.ccc-hb .t>i{display:block;height:100%;border-radius:5px}.ccc-hb .x{color:#e7eef9;font-variant-numeric:tabular-nums;font-weight:600;font-size:11.5px}
.ccc-pr{margin:10px 0}.ccc-pr .h{display:flex;justify-content:space-between;font-size:12px;color:#c9d5ea;margin-bottom:5px}.ccc-pr .h b{color:#fff}

.ccc-tbl td,.ccc-tbl th{font-size:12px}.ccc-tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600;border:1px solid}
.ccc-empty{color:var(--mu);font-size:12.5px;padding:18px 4px}

#work-home>.grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))!important;gap:12px!important}
#work-home>.grid .card{padding:14px 16px!important}#work-home>.grid .card h2{font-size:14px!important;margin:0 0 6px!important}
.ccc-ctx{padding:12px 18px!important;margin:0 0 16px!important}.ccc-ctx p.muted{font-size:12px!important;margin:6px 0 0!important}.ccc-ctx:before{content:"Workspace context";display:block;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mu2);font-weight:600;margin-bottom:8px}
