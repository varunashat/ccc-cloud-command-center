name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android-app/**', '.github/workflows/android.yml', 'pwa/**']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Create Android project
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: App icon and cleartext off
        working-directory: android-app
        run: |
          pip install pillow -q
          python3 - <<'PY'
          from PIL import Image
          import os
          src=Image.open('icon.png').convert('RGBA')
          for d,s in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              p=f'android/app/src/main/res/mipmap-{d}'
              for n in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  if os.path.exists(f'{p}/{n}'): src.resize((s,s)).save(f'{p}/{n}')
          PY
      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CCC-android-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
