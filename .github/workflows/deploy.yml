# Test, build and deploy Cloud Command Center on every push to the working branch or main.
# Azure access uses GitHub OIDC (no stored secrets): the repo variables AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID are identifiers, not credentials.
name: deploy-ccc
on:
  push:
    branches: [main, feature/client-inventory-hub-pdf-deploy-chat]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy-ccc
  cancel-in-progress: false
env:
  ACR: cccacr1a5492
  RG: rg-cloud-command-center
  APP: cloud-command-center
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install reportlab
      - name: Unit tests
        run: python -m unittest tests.test_agent_store tests.test_laptop_policy tests.test_laptop_executor tests.test_laptop_agent tests.test_browser_agent tests.test_hub_report tests.test_deploy_chat tests.test_hub_jobs tests.test_hub_chat tests.test_portal_agent tests.test_hub_overview
      - name: JavaScript syntax
        run: node --check hub_workspace.js && node --check extension/agent_bg.js && node --check extension/ccc_bridge.js
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build image in ACR
        run: |
          TAG="gh-$(date +%m%d%H%M)-${GITHUB_SHA::7}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          az acr build -r "$ACR" -t "ccc:$TAG" . -o none
      - name: Deploy and verify (rolls back if the new revision is unhealthy)
        run: |
          PREV=$(az containerapp show -n "$APP" -g "$RG" --query "properties.template.containers[0].image" -o tsv)
          echo "Previous image: $PREV"
          az containerapp update -n "$APP" -g "$RG" --image "$ACR.azurecr.io/ccc:$TAG" -o none
          REV=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestRevisionName -o tsv)
          for i in $(seq 1 30); do
            STATE=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$REV" --query properties.healthState -o tsv)
            echo "revision $REV health: $STATE"
            [ "$STATE" = "Healthy" ] && { echo "Deployed $TAG as $REV"; exit 0; }
            sleep 10
          done
          echo "New revision did not become healthy; rolling back to $PREV"
          az containerapp update -n "$APP" -g "$RG" --image "$PREV" -o none
          exit 1
